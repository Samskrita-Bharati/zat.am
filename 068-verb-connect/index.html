<!DOCTYPE html>
<html lang="sa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purusha Verb Connect</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="game-container">
        <div class="score-display">
            Score: <span id="score-counter">0</span> | 
            Streak: <span id="streak-counter" style="color: #6366f1;">0</span> | 
            High: <span id="high-counter" style="color: #eab308;">0</span> |
            Time: <span id="timer-display" style="color: #ef4444;">15</span>s
        </div>

        <div class="instructions">
            Match all pairs! Click a Pronoun on the left, then its Verb on the right.
        </div>
        
        <div class="connect-board">
            <div class="column" id="left-column">
                <!-- Left pronoun items inject dynamically -->
            </div>
            <div class="column" id="right-column">
                <!-- Right verb items inject dynamically -->
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
