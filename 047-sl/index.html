<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@sanskrit-coders/sanscript@1.1.0/sanscript.min.js"></script>
    <title>सर्पलीला</title>
    <link rel="icon" type="image/x-icon" href="../images/icon.png">
    <link rel="stylesheet" href="css/index.css">
    <meta name="author" content="Karanveer">
</head>
<body data-page="games">

    <!-- Shared Zat.am Navbar -->
    <div id="navbar-mount"></div>

    <header class="wide-box">
        <h2>सर्पक्रीडायां स्वागतम् 🐍</h2>
        <p>किं त्वं सज्जः असि?</p>
    </header>
    <main>
        <section class="game-preview">
            <h3>पूर्वावलोकनम्</h3>
            <img src="images/preview.png" alt="Game Preview">
        </section>
        <section id="instructions" hidden>
            <h3>How to Play</h3>
            <ol>
                <li>Use arrow keys to control the snake</li>
                <li>Eat the food to grow longer and Avoid hitting the walls or yourself</li>
                <li>Survive as long as possible and beat your high score</li>
            </ol>
        </section>
    </main>
    <footer class="wide-box">
        <button onclick="window.location.href='content/game.html'">अधुना क्रीडतु! Play Now</button>
        <button type="button" onclick="document.getElementById('instructions').hidden = false; this.hidden = true;">HOWTO</button>
    </footer>


    <!-- Shared Zat.am Navbar -->
    <script
      type="module"
      src="../js/navbar-loader.js"
    ></script>
</body>
</html>
