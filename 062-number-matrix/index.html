<!DOCTYPE html>
<html lang="sa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanskrit Number Matrix</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="game-container">
        <div class="score-display">
            Score: <span id="score-counter">0</span> | 
            Streak: <span id="streak-counter" style="color: #6366f1;">0</span> | 
            High: <span id="high-counter" style="color: #eab308;">0</span> |
            Time: <span id="timer-display" style="color: #ef4444;">10</span>s
        </div>
        
        <div class="target-card">
            <p>Find the Digit For:</p>
            <h1 id="target-word">Loading...</h1>
        </div>

        <div class="matrix-grid" id="number-grid">
            <!-- Grid tiles will be injected here dynamically by JavaScript -->
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
