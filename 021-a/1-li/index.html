<html>
  <head>
    <title>अन्वेषणम् — 1-li</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../shared/game-theme.css" />
    <link rel="stylesheet" href="../styles.css" />
    <script src="../data.json"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      svg {
        position: relative;
        left: 10%;
        top: 5%;
        width: 80%;
        height: 80%;
      }
      text {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="mode-ui">
      <div class="zatam-game-actions mode-controls">
        <p class="zatam-game-status zatam-game-status-info mode-status">Find<span id="msg"></span><span id="remain" class="mode-remaining"></span></p>
        <button class="zatam-game-btn zatam-game-btn-primary" type="button" onclick="showall()">I give up!</button>
        <button class="zatam-game-btn zatam-game-btn-secondary" type="button" onclick="restartGame()">Restart</button>
      </div>
    </div>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 1000 1000"
      version="1.1"
      overflow="auto"
    >
      <!-- 
    Johan Karlsson, 2020
    https://twitter.com/DonKarlssonSan 
	
	https://codepen.io/DonKarlssonSan/pen/ExawemK
	
  -->
    </svg>

    <script>
      /*
  Johan Karlsson
  https://github.com/DonKarlssonSan/vectory
*/
      const urlParams = new URLSearchParams(window.location.search);
      var set = urlParams.get("s");
      if (!set || isNaN(set) || set >= nums.length) set = 0;
      var minvalue = Infinity;
      var val = "";
      var found = 0;
      var wrong = 0;
      var gameCompleted = false;
      var gameTime = "00:00";
      var gameStartedAt = null;
      var gameTimerInterval = null;
      function startGameTimer() {
        if (gameStartedAt !== null) return;
        gameStartedAt = Date.now();
        gameTimerInterval = window.setInterval(updateGameTimer, 1000);
        updateGameTimer();
      }
      function updateGameTimer() {
        var elapsed = Math.floor((Date.now() - gameStartedAt) / 1000);
        gameTime = String(Math.floor(elapsed / 60)).padStart(2, "0") + ":" + String(elapsed % 60).padStart(2, "0");
        publishGameStats();
      }
      function publishGameStats() {
        window.parent.postMessage({ type: "anveshan-stats", found, time: gameTime, errors: wrong }, "*");
      }
      function finishGame() {
        gameCompleted = true;
        stopGameTimer();
        var elapsedSeconds = gameStartedAt === null ? 0 : Math.floor((Date.now() - gameStartedAt) / 1000);
        gameTime = String(Math.floor(elapsedSeconds / 60)).padStart(2, "0") + ":" + String(elapsedSeconds % 60).padStart(2, "0");
        publishGameStats();
        window.parent.postMessage({ type: "anveshan-complete", found, errors: wrong, elapsedSeconds, time: gameTime }, "*");
      }
      function stopGameTimer() {
        if (gameTimerInterval !== null) window.clearInterval(gameTimerInterval);
        gameTimerInterval = null;
      }
      function restartGame() {
        window.location.reload();
      }
      let texts = [];
      let counts = [];
      nums[set].forEach((character) => {
        counts[character] = 0;
      });
      class Vector {
        constructor(x, y) {
          this.x = x;
          this.y = y;
        }

        sub(v) {
          return new Vector(this.x - v.x, this.y - v.y);
        }

        getLength() {
          return Math.hypot(this.x, this.y);
        }

        equals(v) {
          return this.x == v.x && this.y == v.y;
        }
      }

      const getThemeColor = (name) =>
        getComputedStyle(document.documentElement)
          .getPropertyValue(`--zatam-${name}`)
          .trim();
      var colors = ["gold", "coral", "blue", "muted", "success"].map(getThemeColor);
      const correctStroke = getThemeColor("blue");
      const incorrectStroke = getThemeColor("coral");
      const successFill = getThemeColor("success-soft");
      /*
  Johan Karlsson, 2020
  https://twitter.com/DonKarlssonSan
  MIT License, see Details View
  
  https://en.wikipedia.org/wiki/Voronoi_diagram
  https://en.wikipedia.org/wiki/Delaunay_triangulation
  https://en.wikipedia.org/wiki/Bowyer%E2%80%93Watson_algorithm
  https://en.wikipedia.org/wiki/Circumscribed_circle
*/

      const svgNs = "http://www.w3.org/2000/svg";
      let svg;
      let w;
      let h;

      class Triangle {
        constructor(a, b, c) {
          this.a = a;
          this.b = b;
          this.c = c;
        }

        vertexes() {
          return [this.a, this.b, this.c];
        }

        edges() {
          return [
            [this.a, this.b],
            [this.b, this.c],
            [this.c, this.a],
          ];
        }

        sharesAVertexWith(triangle) {
          // TODO: optimize me please!
          for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
              let v = this.vertexes()[i];
              let vv = triangle.vertexes()[j];
              if (v.equals(vv)) {
                return true;
              }
            }
          }
          return false;
        }

        sharesAnEdgeWith(triangle) {
          let edges = triangle.edges();
          for (let i = 0; i < edges.length; i++) {
            let edge = edges[i];
            if (this.hasEdge(edge)) {
              return true;
            }
          }
          return false;
        }

        hasEdge(edge) {
          for (let i = 0; i < 3; i++) {
            let e = this.edges()[i];
            if (
              (e[0].equals(edge[0]) && e[1].equals(edge[1])) ||
              (e[1].equals(edge[0]) && e[0].equals(edge[1]))
            ) {
              return true;
            }
          }
          return false;
        }

        get circumcenter() {
          if (this._circumcenter) {
            return this._circumcenter;
          }
          let d =
            2 *
            (this.a.x * (this.b.y - this.c.y) +
              this.b.x * (this.c.y - this.a.y) +
              this.c.x * (this.a.y - this.b.y));

          let x =
            (1 / d) *
            ((this.a.x * this.a.x + this.a.y * this.a.y) *
              (this.b.y - this.c.y) +
              (this.b.x * this.b.x + this.b.y * this.b.y) *
                (this.c.y - this.a.y) +
              (this.c.x * this.c.x + this.c.y * this.c.y) *
                (this.a.y - this.b.y));

          let y =
            (1 / d) *
            ((this.a.x * this.a.x + this.a.y * this.a.y) *
              (this.c.x - this.b.x) +
              (this.b.x * this.b.x + this.b.y * this.b.y) *
                (this.a.x - this.c.x) +
              (this.c.x * this.c.x + this.c.y * this.c.y) *
                (this.b.x - this.a.x));
          this._circumcenter = new Vector(x, y);
          return this._circumcenter;
        }

        pointIsInsideCircumcircle(point) {
          let circumcenter = this.circumcenter;
          let circumradius = circumcenter.sub(this.a).getLength();
          let dist = point.sub(circumcenter).getLength();
          return dist < circumradius;
        }
      }

      function getRandomPoints() {
        let pointList = [];
        let div = Math.random() * 3000 + 1000;
        let nrOfPoints = (w * h) / div;
        for (let i = 0; i < nrOfPoints; i++) {
          pointList.push(new Vector(Math.random() * w, Math.random() * h));
        }
        return pointList;
      }

      function bowyerWatson(superTriangle, pointList) {
        // pointList is a set of coordinates defining the
        // points to be triangulated
        let triangulation = [];

        // add super-triangle to triangulation
        // must be large enough to completely contain all
        // the points in pointList
        triangulation.push(superTriangle);

        // add all the points one at a time to the triangulation
        pointList.forEach((point) => {
          let badTriangles = [];

          // first find all the triangles that are no
          // longer valid due to the insertion
          triangulation.forEach((triangle) => {
            if (triangle.pointIsInsideCircumcircle(point)) {
              badTriangles.push(triangle);
            }
          });
          let polygon = [];

          // find the boundary of the polygonal hole
          badTriangles.forEach((triangle) => {
            triangle.edges().forEach((edge) => {
              let edgeIsShared = false;
              badTriangles.forEach((otherTriangle) => {
                if (triangle !== otherTriangle && otherTriangle.hasEdge(edge)) {
                  edgeIsShared = true;
                }
              });
              if (!edgeIsShared) {
                //edge is not shared by any other
                // triangles in badTriangles
                polygon.push(edge);
              }
            });
          });

          // remove them from the data structure
          badTriangles.forEach((triangle) => {
            let index = triangulation.indexOf(triangle);
            if (index > -1) {
              triangulation.splice(index, 1);
            }
          });

          // re-triangulate the polygonal hole
          polygon.forEach((edge) => {
            //form a triangle from edge to point
            let newTri = new Triangle(edge[0], edge[1], point);
            triangulation.push(newTri);
          });
        });

        // done inserting points, now clean up
        let i = triangulation.length;
        while (i--) {
          let triangle = triangulation[i];
          if (triangle.sharesAVertexWith(superTriangle)) {
            //remove triangle from triangulation
            let index = triangulation.indexOf(triangle);
            if (index > -1) {
              triangulation.splice(index, 1);
            }
          }
        }

        return triangulation;
      }

      function getVoronoiLines(triangles) {
        let lines = [];
        for (let i = 0; i < triangles.length; i++) {
          let currentTriangle = triangles[i];

          for (let j = i + 1; j < triangles.length; j++) {
            let otherTriangle = triangles[j];
            if (currentTriangle.sharesAnEdgeWith(otherTriangle)) {
              let line = {
                x1: currentTriangle.circumcenter.x,
                y1: currentTriangle.circumcenter.y,
                x2: otherTriangle.circumcenter.x,
                y2: otherTriangle.circumcenter.y,
              };
              lines.push(line);
              let txt = {
                x:
                  (currentTriangle.circumcenter.x +
                    otherTriangle.circumcenter.x) /
                  2,
                y:
                  (currentTriangle.circumcenter.y +
                    otherTriangle.circumcenter.y) /
                  2,
              };
              texts.push(txt);
            }
          }
        }
        return lines;
      }

      function drawLines(groupElement, lines) {
        lines.forEach((line) => {
          let lineElement = createLineElement(line);
          groupElement.appendChild(lineElement);
        });
        texts.forEach((txt) => {
          if (
            txt.x > 10 &&
            txt.y > 10 &&
            txt.x < window.innerWidth / 2 - 10 &&
            txt.y < window.innerHeight / 2 - 10
          ) {
            let textElement = createTextElement(txt);
            groupElement.appendChild(textElement);
          }
        });

        for (i = 0; i < nums[set].length; i++) {
          if (counts[nums[set][i]] < minvalue) {
            minvalue = counts[nums[set][i]];
            val = nums[set][i];
          }
        }
        document.getElementById("msg").innerHTML =
          " " + minvalue + " instances of <strong>" + val + "</strong>";
      }

      function createLineElement(line) {
        let lineElement = document.createElementNS(svgNs, "line");
        lineElement.setAttribute("x1", line.x1);
        lineElement.setAttribute("y1", line.y1);
        lineElement.setAttribute("x2", line.x2);
        lineElement.setAttribute("y2", line.y2);
        lineElement.setAttribute(
          "stroke",
          colors[Math.floor(Math.random() * colors.length)],
        );
        return lineElement;
      }

      function createTextElement(txt) {
        let textElement = document.createElementNS(svgNs, "text");
        textElement.setAttribute("x", txt.x);
        textElement.setAttribute("y", txt.y);
        textElement.setAttribute("fill", getThemeColor("text"));
        textElement.onclick = abc;
        textElement.innerHTML =
          nums[set][Math.floor(Math.random() * nums[set].length)];
        counts[textElement.innerHTML]++;
        return textElement;
      }
      var abc = function (evt) {
        if (gameCompleted) return;
        startGameTimer();
        if (evt.target.innerHTML == val) {
          evt.target.onclick = "";
          evt.target.setAttribute("stroke", correctStroke);
          evt.target.setAttribute("fill", successFill);
          found++;
          publishGameStats();
          document.getElementById("remain").innerHTML =
            " Still to find : " + (minvalue - found);
          if (found >= minvalue) {
            finishGame();
            txtnods = document.querySelectorAll("text");
            for (var i = 0; i < txtnods.length; i++) {
              txtnods[i].onclick = "";
            }
          }
        } else {
          evt.target.setAttribute("stroke", incorrectStroke);
          wrong++;
          publishGameStats();
        }
      };

      function setup() {
        svg = document.querySelector("svg");
        document.addEventListener("keydown", onKeyDown);
        onResize();
      }

      function onResize() {
        w = window.innerWidth / 2;
        h = window.innerHeight / 2;
        svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
        draw();
      }

      function onKeyDown(e) {
        if (e.code === "KeyD") {
          download();
        }
      }

      function download() {
        let svgDoc = svg.outerHTML;
        let filename = "voronoi.svg";
        let element = document.createElement("a");
        element.setAttribute(
          "href",
          "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgDoc),
        );
        element.setAttribute("download", filename);
        element.style.display = "none";
        document.body.appendChild(element);
        element.addEventListener("click", (e) => e.stopPropagation());
        element.click();
        document.body.removeChild(element);
      }
      function showall() {
        txtnods = document.querySelectorAll("text");
        for (var i = 0; i < txtnods.length; i++) {
          if (txtnods[i].innerHTML == val)
            if (txtnods[i].getAttribute("stroke") != correctStroke) {
              txtnods[i].setAttribute("stroke", getThemeColor("danger"));
              txtnods[i].setAttribute("stroke-width", "2.5");
            }
        }
      }
      function draw() {
        texts = [];
        let group = document.querySelector("g");
        if (group) {
          group.remove();
        }
        group = document.createElementNS(svgNs, "g");
        group.setAttribute("stroke", getThemeColor("navy"));

        let pointList = getRandomPoints();

        let superTriangle = new Triangle(
          new Vector(-w * 10, h * 10),
          new Vector(w * 10, h * 10),
          new Vector(w / 2, -h * 10),
        );

        let triangles = bowyerWatson(superTriangle, pointList);
        let lines = getVoronoiLines(triangles);
        drawLines(group, lines);
        svg.appendChild(group);
      }

      setup();
    </script>
  </body>
</html>
