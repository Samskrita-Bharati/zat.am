<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Memory क्रीडा</title>

    <!-- KEEP OLD (Bootstrap 4.4.1) for header compatibility -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
      crossorigin="anonymous"
    />
    <script
      src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
      integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0ww1yYfoRSJoZ+n"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3vZ9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
      integrity="sha384-wfSDF2E50Y2D1uUd0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
      crossorigin="anonymous"
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/@sanskrit-coders/sanscript@1.1.0/sanscript.min.js"></script>
    <script src="./js/transliteration.js"></script>

    <!-- Page CSS first, BP26 shared header CSS last -->
    <link href="css/mmk.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="css/header.css" />

    <script
      type="text/javascript"
      src="https://unpkg.com/papaparse@latest/papaparse.min.js"
    ></script>
  </head>

  <body class="memory-game">
    <!-- Auth Middleware -->
    <script type="module" src="/auth/api/middleware.js"></script>

    <!-- BP26 shared navbar -->
    <div id="header-placeholder"></div>
    <script type="module" src="../js/bilingual-toggle.js"></script>
    <script src="js/load-header.js"></script>

    <main class="memory-game-main">
      <h1>Memory क्रीडा</h1>
      <div class="header-divider"></div>

      <!-- Added Time + keep old counters -->
      <p id="wm">
        Matches Done: <span id="nomd">०</span> Wrong Moves:
        <span id="nowt">०</span>
        <span class="time-stat">Time: <span id="timeDisp">0</span>s</span>
      </p>

      <progress id="pr" max="15" value="0"></progress>
      <div id="mytable"></div>

      <!-- Score badge + submit button -->
      <div id="scoreBadge">Score: <span id="scoreValue">0</span></div>
      <button id="submitScoreBtn">Submit Score (Game 2)</button>
    </main>

    <!-- Celebration overlay -->
    <div id="bp26CelebrateOverlay">
      <div class="bp26CelebrateBox">
        <div class="bp26Sparkles">✨🎉✨</div>
        <div
          id="bp26CelebrateTitle"
          style="font-weight: 700; font-size: 18px; margin-bottom: 6px"
        >
          Submitted ✅
        </div>
        <div id="bp26CelebrateSub" style="font-size: 14px; color: #374151">
          Nice work!
        </div>
        <button id="bp26CelebrateClose" class="bp26Btn">Close</button>
      </div>
    </div>

    <script type="module">
      /* Make reportScore available globally like your new file expects */
      import { reportScore, bp26Init } from "./js/bp26-score.js";
      window.reportScore = reportScore;
      const translit = window.bp26Translit;

      // Init scoring namespace
      window.bp26Init = bp26Init;
      window.bp26Init({ game: "bp26-Game2", day: 2 });

      // celebration helpers
      function bp26BurstConfetti(count = 60) {
        for (let i = 0; i < count; i++) {
          const c = document.createElement("div");
          c.className = "bp26Confetti";
          c.style.left = Math.random() * 100 + "vw";
          c.style.width = 6 + Math.random() * 8 + "px";
          c.style.height = 6 + Math.random() * 8 + "px";
          c.style.background = `hsl(${Math.floor(Math.random() * 360)}, 90%, 60%)`;
          c.style.animationDuration = 800 + Math.random() * 600 + "ms";
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 2000);
        }
      }

      function bp26Celebrate({
        title = "Submitted ✅",
        subtitle = "Nice work!",
        score = null,
      } = {}) {
        const overlay = document.getElementById("bp26CelebrateOverlay");
        const t = document.getElementById("bp26CelebrateTitle");
        const s = document.getElementById("bp26CelebrateSub");

        t.textContent = title;
        s.textContent =
          score === null ? subtitle : `${subtitle}  Score: ${score} ✨`;

        overlay.style.display = "flex";
        bp26BurstConfetti(70);

        setTimeout(() => {
          overlay.style.display = "none";
        }, 3000);
      }

      document
        .getElementById("bp26CelebrateClose")
        .addEventListener("click", () => {
          document.getElementById("bp26CelebrateOverlay").style.display =
            "none";
        });

      document
        .getElementById("bp26CelebrateOverlay")
        .addEventListener("click", (e) => {
          if (e.target.id === "bp26CelebrateOverlay") {
            e.target.style.display = "none";
          }
        });

      // ---------------------------
      // Timer
      // ---------------------------
      let secs = 0;
      let timer = null;

      function tick() {
        secs++;
        const t = document.getElementById("timeDisp");
        if (t) t.textContent = String(secs);
      }

      // score state
      let scoreSubmitted = false;
      let currentScore = 0;

      function updateScoreUI() {
        const el = document.getElementById("scoreValue");
        if (el) el.textContent = String(currentScore);
      }

      function computeScore(matchesdone) {
        // computeScore(wpp, wrongMoves) OLD FORMULA
        // const base = wpp * 10;
        // const penaltyWrong = wrongMoves * 2;
        // const penaltyTime = secs;
        // return Math.max(0, base - penaltyWrong - penaltyTime);
        return matchesdone * 10;
      }

      async function submitScoreNow() {
        if (scoreSubmitted) return;

        const btn = document.getElementById("submitScoreBtn");

        if (btn) {
          btn.disabled = true;
          btn.textContent = "Submitting...";
        }

        try {
          if (typeof window.reportScore !== "function") {
            alert("Score system not loaded. Check ./js/bp26-score.js path.");

            if (btn) {
              btn.disabled = false;
              btn.textContent = "Submit Score (Game 2)";
            }

            return;
          }

          await window.reportScore(currentScore);
          scoreSubmitted = true;

          if (btn) {
            btn.textContent = `Submitted ✅ (Score: ${currentScore})`;
          }

          bp26Celebrate({
            title: "Score Submitted ✅",
            subtitle: "Great job!",
            score: currentScore,
          });
        } catch (e) {
          console.error("❌ submit score failed", e);
          alert("Submit failed. Open Console (F12) and send the red error.");

          if (btn) {
            btn.disabled = false;
            btn.textContent = "Submit Score (Game 2)";
          }
        }
      }

      document
        .getElementById("submitScoreBtn")
        .addEventListener("click", submitScoreNow);

      // ---------------------------
      // OLD GAME LOGIC BELOW
      // Gameplay, score, data source and submission behavior are preserved.
      // ---------------------------
      document.addEventListener("DOMContentLoaded", function () {
        var lnk =
          "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6CFR_0gDsZl-lmwLFWmtdXMXYGVEHGJ8fvBu2_5wvbEl9L-4Yr0ugI0TFTTdvtLlMTRmLnCIJ5FBF/pub?gid=0&single=true&output=csv";

        Papa.parse(lnk, {
          download: true,
          header: true,
          complete: populateWlist,
        });
      });

      function populateWlist(fildat) {
        var wpp = 15; // words per page
        document.getElementById("pr").max = wpp;

        const fullist = fildat.data || [];
        var openmojibase = "https://openmoji.org/data/color/svg/";

        var numberOfWrongTries = 0;
        var matchesdone = 0;
        var triesElement = document.getElementById("nowt");

        const urlParams = new URLSearchParams(window.location.search);

        var o = urlParams.get("o");
        if (!o) o = 0;

        var set = urlParams.get("s");
        if (!set || isNaN(set) || set >= fullist.length) set = 0;

        var image = [];
        var words = [];
        var imglnk = "";

        for (let i = 0; i < wpp; i++) {
          const row = fullist[set * wpp + i];
          if (!row) continue;

          words.push(row.padam);

          const imgVal = row["Imaage link"] || "";

          if (imgVal.length == 4 || imgVal.length == 5) {
            imglnk = openmojibase + imgVal + ".svg";
          } else {
            imglnk = imgVal;
          }

          image.push(imglnk);
        }

        while (words.length && !words[words.length - 1]) words.pop();
        while (image.length && !image[image.length - 1]) image.pop();

        var colors = [
          "tomato",
          "aqua",
          "blue",
          "fuchsia",
          "gray",
          "green",
          "lime",
          "maroon",
          "navy",
          "olive",
          "purple",
          "red",
          "silver",
          "teal",
          "yellow",
        ];

        var l = urlParams.get("l");
        if (!l) l = 0;

        const tScript = translit.getTargetScript();

        function restart() {
          location.reload();
        }

        /*
          Same 24-card game size at every breakpoint:
          desktop      = 6 × 4
          phone/tablet = 4 × 6
          small phone  = 3 × 8
        */
        var rowLength;
        var colLength;

        // Kept from the original game for compatibility.
        var width = 150;
        var height = 120;

        const viewportWidth = window.innerWidth;

        if (viewportWidth <= 768) {
          // Mobile
          colLength = 3;
          rowLength = 8;
          width = 82;
          height = 82;
        } else if (viewportWidth <= 1024) {
          // Tablet
          colLength = 4;
          rowLength = 6;
          width = 95;
          height = 95;
        } else {
          // Desktop
          colLength = 6;
          rowLength = 4;
          width = 150;
          height = 120;
        }

        var gamesize = rowLength * colLength;

        // start timer (only play mode)
        if (l != 1) {
          secs = 0;

          if (timer) {
            clearInterval(timer);
          }

          timer = setInterval(tick, 1000);
        }

        tick();

        function refreshScoreUI() {
          currentScore = computeScore(matchesdone);
          updateScoreUI();
        }

        refreshScoreUI();

        function code() {
          var waiting = { value: false };
          var D1Data = [];
          var D2Data = [];
          var count = 0;

          for (var x = 0; x < gamesize / 2; x++) {
            D1Data.push({ src: image[x], clicked: false });
            D1Data.push({
              src: image[x],
              clicked: false,
              wrd: words[x],
            });
          }

          var rand = 0;

          for (var y = 0; y < rowLength; y++) {
            var temp = [];
            var x = 0;

            while (x < colLength) {
              rand = Math.floor(Math.random() * D1Data.length);
              temp.push(D1Data[rand]);
              temp[x].y = x;
              temp[x].x = y;
              D1Data.splice(rand, 1);
              x++;
            }

            D2Data.push(temp);
          }

          var clickedCards = [];
          var bg = "bp26e.png";

          function genTable(rowLength, colLength, imageData2D) {
            var table = document.createElement("TABLE");
            table.id = "tbl";

            var myTableDiv = document.getElementById("mytable");
            myTableDiv.innerHTML = "";

            for (var i = 0; i < rowLength; i++) {
              var tr = document.createElement("TR");
              table.appendChild(tr);

              for (var j = 0; j < colLength; j++) {
                var td = document.createElement("TD");
                tr.appendChild(td);

                if (!imageData2D[i][j].wrd) {
                  var img = document.createElement("img");

                  if (o != 1) {
                    img.src = bg;
                  } else {
                    img.src = imageData2D[i][j].src;
                  }

                  td.appendChild(img);
                } else {
                  var p = document.createElement("p");
                  p.className = "myp";
                  p.innerHTML = imageData2D[i][j].wrd;

                  if (tScript) {
                    p.innerHTML +=
                      " - " +
                      translit.transliterate(
                        imageData2D[i][j].wrd,
                        "devanagari",
                      );
                  }

                  td.appendChild(p);
                }
              }
            }

            myTableDiv.appendChild(table);
          }

          genTable(rowLength, colLength, D2Data);

          var clkfn = function () {
            var row = this.parentElement.parentElement.rowIndex;
            var column = this.parentElement.cellIndex;

            if (!D2Data[row][column].clicked && !waiting.value) {
              if (clickedCards.length == 0) {
                if (this.tagName.toLowerCase() === "img") {
                  this.src = D2Data[row][column].src;
                }

                D2Data[row][column].clicked = true;
                clickedCards.push(D2Data[row][column]);

                const d =
                  document.getElementsByTagName("tr")[clickedCards[0].x];
                const r = d.getElementsByTagName("td")[clickedCards[0].y];

                r.style.border = "2px dashed red";
              } else {
                if (D2Data[row][column].src === clickedCards[0].src) {
                  const d =
                    document.getElementsByTagName("tr")[clickedCards[0].x];
                  const r = d.getElementsByTagName("td")[clickedCards[0].y];

                  r.style.border = "3px solid " + colors[matchesdone];
                  r.style.cursor = "no-drop";
                  r.style.color = "blue";

                  matchesdone++;

                  r.innerHTML +=
                    "<br>☑️ " + translit.numberToDevanagari(matchesdone);

                  document.getElementById("pr").value = matchesdone;

                  document.getElementById("nomd").innerHTML =
                    translit.numberToDevanagari(matchesdone);

                  this.parentElement.style.border =
                    "3px solid " + colors[matchesdone - 1];

                  this.parentElement.style.cursor = "no-drop";
                  this.style.color = "blue";

                  this.innerHTML +=
                    "<br>✔️ " + translit.numberToDevanagari(matchesdone);

                  if (this.tagName.toLowerCase() === "img") {
                    this.src = D2Data[row][column].src;
                  }

                  D2Data[row][column].clicked = true;
                  clickedCards = [];
                  count += 2;

                  refreshScoreUI();

                  if (count == gamesize) {
                    if (timer) {
                      clearInterval(timer);
                    }

                    refreshScoreUI();
                    submitScoreNow();

                    window.alert(
                      "उत्तमम् ! You matched all " +
                        translit.numberToDevanagari(wpp) +
                        " in " +
                        translit.numberToDevanagari(secs) +
                        " seconds while making " +
                        translit.numberToDevanagari(numberOfWrongTries) +
                        " wrong moves\n\nFinal Score: " +
                        currentScore,
                    );

                    var ask = confirm("पुनः ? Press 'ok' to play again");

                    if (ask) {
                      restart();
                    }
                  }
                } else {
                  numberOfWrongTries += 1;

                  triesElement.innerHTML =
                    translit.numberToDevanagari(numberOfWrongTries);

                  if (this.tagName.toLowerCase() === "img") {
                    this.src = D2Data[row][column].src;
                  }

                  D2Data[row][column].clicked = true;
                  waiting.value = true;

                  const d =
                    document.getElementsByTagName("tr")[clickedCards[0].x];
                  const r = d.getElementsByTagName("td")[clickedCards[0].y];

                  r.style.border = "1px solid blue";

                  refreshScoreUI();

                  setTimeout(
                    flipback,
                    700,
                    row,
                    column,
                    this,
                    clickedCards,
                    waiting,
                    D2Data,
                  );
                }
              }
            }
          };

          function flipback(row, column, This, clickedCards, waiting, D2Data) {
            if (This.tagName.toLowerCase() === "img") {
              This.src = bg;
            }

            document.getElementById("tbl").rows[clickedCards[0].x].cells[
              clickedCards[0].y
            ].firstElementChild.src = bg;

            clickedCards[0].clicked = false;
            D2Data[row][column].clicked = false;
            waiting.value = false;
            clickedCards.splice(0, 1);

            refreshScoreUI();
          }

          if (l != 1) {
            /*
              Scope handlers to the game table so navbar/profile images
              can never receive the memory-card click behavior.
            */
            var list = document.querySelectorAll("#tbl img");

            for (var i = 0; i < list.length; i++) {
              list[i].onclick = clkfn;
            }

            var plist = document.querySelectorAll("#tbl .myp");

            for (var i = 0; i < plist.length; i++) {
              plist[i].onclick = clkfn;
            }
          }
        }

        code();
      }
    </script>
  </body>
</html>
