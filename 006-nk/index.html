<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>नाम किम्? naama kim?</title>
	<link rel="stylesheet" href="../shared/game-theme.css">
	<link rel="stylesheet" href="style.css">
</head>
<body data-page="games" class="zatam-themed-game zatam-game-page">

    <!-- Shared Zat.am Navbar -->
    <div id="navbar-mount"></div>

<script>
/*
Starting point was .. https://gist.github.com/tkon99/4c98af713acc73bed74c  ... tkon99/name.js

(c) by Thomas Konings
Random Name Generator for Javascript
*/


function getRandomInt(min, max) {
  	return Math.floor(Math.random() * (max - min)) + min;
}

var nicknameWords = null;

fetch("words.json")
  .then(function (response) {
    if (!response.ok) throw new Error("Could not load words.json");
    return response.json();
  })
  .then(function (words) {
    nicknameWords = words;
    document.getElementById("generate-name-button").disabled = false;
  })
  .catch(function (error) {
    console.error(error);
    document.getElementById("nameplace").textContent = "Name list could not be loaded.";
  });

function generateName() {
  if (!nicknameWords) return "";
  var adjectives = nicknameWords.adjectives;
  var animals = nicknameWords.animals;
  return adjectives[getRandomInt(0, adjectives.length)] + '-' + animals[getRandomInt(0, animals.length)];
}

function shownaama() {
  if (!nicknameWords) return;
  document.getElementById("nameplace").textContent = generateName();
}</script>
<main class="zatam-game-shell">
	<section class="zatam-game-header">
		<span class="zatam-game-eyebrow">Name Generator</span>
		<h1 class="zatam-game-title">नाम किम्?</h1>
		<p class="zatam-game-subtitle">Generate a nickname using an English adjective and a Sanskrit animal name.</p>
	</section>
	<section class="zatam-game-play-area name-generator-card" aria-label="Random Sanskrit name">
		<p id="nameplace" class="name-generator-result" aria-live="polite">नाम-नाम</p>
		<div class="zatam-game-actions">
			<button id="generate-name-button" type="button" class="zatam-game-btn zatam-game-btn-primary" onclick="shownaama()" disabled>नाम किम्?</button>
		</div>
	</section>
</main>


    <!-- Shared Zat.am Navbar -->
    <script
      type="module"
      src="../js/navbar-loader.js"
    ></script>
</body>
</html>
