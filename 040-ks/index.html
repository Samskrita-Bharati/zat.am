<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>
कः समयः ? kaH samayaH ?
</title>
<link rel="stylesheet" href="../shared/game-theme.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@sanskrit-coders/sanscript@1.1.0/sanscript.min.js"></script>
</head>
<body data-page="games" class="zatam-themed-game">

    <!-- Shared Zat.am Navbar -->
    <div id="navbar-mount"></div>

<main class="zatam-game-shell">
  <section class="zatam-game-header">
    <span class="zatam-game-eyebrow">Sanskrit Clock</span>
    <h1 class="zatam-game-title">कः समयः?</h1>
    <p class="zatam-game-subtitle">Learn to read and say the time in Sanskrit.</p>
  </section>
  <section class="zatam-game-instructions clock-instructions" aria-label="Instructions">
    <p>Change the clock time with the dropdowns, then click <strong>Update</strong>.</p>
    <p>Click <strong>Show live</strong> to switch to the current time.</p>
  </section>
  <section class="zatam-game-play-area clock-card" aria-label="Sanskrit clock">
    <canvas id="canvas" width="400" height="400" aria-label="Clock showing the current time"></canvas>
    <p class="time-reading-label">समयः</p>
    <p id="samayaH" class="zatam-game-result-message" aria-live="polite"></p>
    <div class="clock-control-row">
      <div class="clock-time-controls" aria-label="Choose a specific time">
        <label>
          <span>Hour</span>
          <select id="hour-select" aria-label="Hour"></select>
        </label>
        <span class="clock-time-separator" aria-hidden="true">:</span>
        <label>
          <span>Minute</span>
          <select id="minute-select" aria-label="Minute"></select>
        </label>
      </div>
      <button class="zatam-game-btn zatam-game-btn-secondary" type="button" onclick="updateSelectedTime()">Update (approx.) समयः</button>
    </div>
    <div class="zatam-game-actions clock-live-actions">
      <button id="golive" class="zatam-game-btn zatam-game-btn-primary" type="button" onclick="golive()">Show live समयः</button>
    </div>
  </section>
</main>
<script>
const urlParams = new URLSearchParams(window.location.search);
const requestedHour = Number(urlParams.get("hh"));
const requestedMinute = Number(urlParams.get("mm"));
const hasFixedTime = urlParams.has("hh") && urlParams.has("mm") &&
  Number.isInteger(requestedHour) && requestedHour >= 0 && requestedHour <= 23 &&
  Number.isInteger(requestedMinute) && requestedMinute >= 0 && requestedMinute <= 59;
let curr = !hasFixedTime;
let hh = hasFixedTime ? requestedHour : new Date().getHours();
let mm = hasFixedTime ? requestedMinute : new Date().getMinutes();

const hourSelect = document.getElementById("hour-select");
const minuteSelect = document.getElementById("minute-select");
for (let value = 1; value <= 12; value++) {
  const option = document.createElement("option");
  option.value = String(value);
  option.textContent = String(value);
  hourSelect.appendChild(option);
}
for (let value = 0; value < 60; value++) {
  const option = document.createElement("option");
  option.value = String(value);
  option.textContent = String(value).padStart(2, "0");
  minuteSelect.appendChild(option);
}
hourSelect.value = String(hh % 12 || 12);
minuteSelect.value = String(mm);

function updateTimeUrl() {
  const nextUrl = new URL(window.location.href);
  nextUrl.searchParams.set("hh", String(hh));
  nextUrl.searchParams.set("mm", String(mm));
  window.history.replaceState(null, "", nextUrl.toString());
}

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let radius = canvas.height / 2;
ctx.translate(radius, radius);
radius = radius * 0.90;
let clockInterval = null;
if (curr) clockInterval = setInterval(drawClock, 1000);
  else 
{ drawClock();
 updtxt();}

function drawClock() {
  drawFace(ctx, radius);
  drawNumbers(ctx, radius);
  drawTime(ctx, radius);
}

function drawFace(ctx, radius) {
  const grad = ctx.createRadialGradient(0,0,radius*0.95, 0,0,radius*1.05);
  grad.addColorStop(0, '#333');
  grad.addColorStop(0.5, 'white');
  grad.addColorStop(1, '#333');
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, 2*Math.PI);
  ctx.fillStyle = 'white';
  ctx.fill();
  ctx.strokeStyle = grad;
  ctx.lineWidth = radius*0.1;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, radius*0.1, 0, 2*Math.PI);
  ctx.fillStyle = '#333';
  ctx.fill();
}

function drawNumbers(ctx, radius) {
  ctx.font = radius*0.20 + "px arial";
  ctx.textBaseline="middle";
  ctx.textAlign="center";
  for(let num = 1; num < 13; num++){
    let ang = num * Math.PI / 6;
    ctx.rotate(ang);
    ctx.translate(0, -radius*0.85);
    ctx.rotate(-ang);
    //ctx.fillText(num.toString(), 0, 0);
ctx.fillText(Sanscript.t(num.toString(), 'itrans', 'devanagari'), 0, 0);
    ctx.rotate(ang);
    ctx.translate(0, radius*0.85);
    ctx.rotate(-ang);
  }
}

function drawTime(ctx, radius){
    if (curr)
      {
      const now = new Date();
     hour = now.getHours();
     minute = now.getMinutes();
     second = now.getSeconds();
      }
else
   { hour = hh;
     minute = mm;
     second = 0;
} 
    //hour
    hour=hour%12;
    hour=(hour*Math.PI/6)+
    (minute*Math.PI/(6*60))+
    (second*Math.PI/(360*60));
ctx.strokeStyle = 'red';
    drawHand(ctx, hour, radius*0.5, radius*0.07);
    //minute
    minute=(minute*Math.PI/30)+(second*Math.PI/(30*60));
ctx.strokeStyle = 'blue';
    drawHand(ctx, minute, radius*0.7, radius*0.06);
    // second
    second=(second*Math.PI/30);
if (curr){
   ctx.strokeStyle = 'yellow';
    drawHand(ctx, second, radius*0.8, radius*0.02);
  }
}

function drawHand(ctx, pos, length, width) {
    ctx.beginPath();
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.moveTo(0,0);
    ctx.rotate(pos);
    ctx.lineTo(0, -length);
    ctx.stroke();
    ctx.rotate(-pos);
}

function updateSelectedTime()
{
const baseHour = curr ? new Date().getHours() : hh;
const hourPeriod = Math.floor(baseHour / 12);
const selectedHour = Number(hourSelect.value) % 12;
hh = hourPeriod * 12 + selectedHour;
mm = Number(minuteSelect.value);
curr = false;
updateTimeUrl();
drawClock();
updtxt();
}

function updtxt()
{
let samayaH = "";
let hr;
let min;

if (curr)	
 {
  const now = new Date();
  hr = now.getHours();
  min = now.getMinutes();
}
else
{
  hr=hh;
  min=mm;
}

	switch(Math.floor(min/5))
	{
	case 1 : samayaH+="पञ्चाधिक-"; 
       break;
    case 2 : samayaH+="दशाधिक-"; 
       break;
    case 3 : samayaH+="सपाद-"; 
       break;
    case 4 : samayaH+="विंशत्यधिक- / पञ्चाधिक-सपाद-";
       break;
    case 5 : samayaH+="पञ्चविंशत्यधिक- / दशाधिक-सपाद-";
      break;
    case 6 : samayaH+="सार्ध-"; 
      break
	case 7: samayaH+="पञ्चत्रिंशदधिक- / पञ्चाधिक-सार्ध-";
      break;
    case 8: samayaH+="चत्वारिंशधिक- / दशाधिक-सार्ध-"; 
      break;
     case 9: samayaH+="पादोन-"; 
       hr++;
       break;
     case 10: samayaH+="दशोन-"; 
       hr++;
       break;
     case 11: samayaH+="पञ्चोन-"; 
       hr++;
       break;
     }
     
     if (hr > 12) hr=hr-12;
     
     switch(Math.floor(hr))
	{
	case 1 : samayaH+="एक";
       break;
    case 2 : samayaH+="द्वि";
       break;
    case 3 : samayaH+="त्रि";
       break;
    case 4 : samayaH+="चतुर्";
       break;
    case 5 : samayaH+="पञ्च";
      break;
    case 6 : samayaH+="षड्";
      break
	case 7: samayaH+="सप्त";
      break;
    case 8: samayaH+="अष्ट";
      break;
     case 9: samayaH+="नव";
       break;
     case 10: samayaH+="दश";
       break;
     case 11: samayaH+="एकादश";
       break;
     case 12: samayaH+="द्वादश";
       break;
     }
     samayaH+="-वादनम्";
document.getElementById("samayaH").textContent = samayaH;
}

function golive()
{
 curr=true;
 const liveUrl = new URL(window.location.href);
 liveUrl.searchParams.delete("hh");
 liveUrl.searchParams.delete("mm");
 window.history.replaceState(null, "", liveUrl.toString());
 const now = new Date();
 hourSelect.value = String(now.getHours() % 12 || 12);
 minuteSelect.value = String(now.getMinutes());
 if (!clockInterval) clockInterval = setInterval(drawClock, 1000);
drawClock();
updtxt();
}
</script>



    <!-- Shared Zat.am Navbar -->
    <script
      type="module"
      src="../js/navbar-loader.js"
    ></script>
</body>
</html>
