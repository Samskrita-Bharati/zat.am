<!DOCTYPE html>
<html lang="sa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandhi Splitter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="game-container">
        <div class="score-display">
            Score: <span id="score-counter">0</span> | 
            Streak: <span id="streak-counter" style="color: #6366f1;">0</span> | 
            High: <span id="high-counter" style="color: #eab308;">0</span> |
            Time: <span id="timer-display" style="color: #ef4444;">15</span>s
        </div>
        
        <div class="prompt-box">
            <p>Click the gap where the two words split apart:</p>
            <div class="split-string-container" id="word-slice-zone">
                <!-- Individual letters with interactive split boundaries go here -->
            </div>
        </div>

        <div class="preview-box">
            <div class="word-part" id="part-left">?</div>
            <div class="part-plus">+</div>
            <div class="word-part" id="part-right">?</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
