<!doctype html>
<html lang="sa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>श्रीमद्-भगवद्गीता-श्लोकसंग्रह</title>
    <link rel="stylesheet" href="../shared/game-theme.css">
    <link rel="stylesheet" href="./collection.css">
</head>
<body data-page="games" class="shloka-page">
    <div id="navbar-mount"></div>

    <main class="shloka-collection zatam-game-shell">
        <header class="zatam-game-header">
            <h1 id="title" class="zatam-game-title">श्रीमद्-भगवद्गीता-श्लोकसंग्रह</h1>
            <p id="intro">श्लोकान् पठितुम् अध्यायं चिनोतु।</p>
            <button id="collection-language" type="button" lang="en">English?</button>
        </header>
        <nav id="grid-container" class="chapter-grid" aria-label="अध्यायाः"></nav>
    </main>

    <footer class="shloka-footer">
        <p id="collection-credit">© 2024 Samskrita Bharati. All rights reserved. Crafted with ♥ by Karanveer Masoun.</p>
    </footer>

    <script>
        const copy = {
            sa: {
                title: "श्रीमद्-भगवद्गीता-श्लोकसंग्रह",
                intro: "श्लोकान् पठितुम् अध्यायं चिनोतु।",
                chapters: "अध्यायाः",
                chapter: "अध्यायः",
                switchTo: "English",
                credit: "© २०२४ संस्कृतभारती । करणवीर मासौण द्वारा",
            },
            en: {
                title: "Bhagavad Gita Shloka Collection",
                intro: "Choose a chapter to read its verses.",
                chapters: "Chapters",
                chapter: "Chapter",
                switchTo: "Sanskrit",
                credit: "© 2024 Samskrita Bharati. All rights reserved. Crafted with ♥ by Karanveer Masoun.",
            },
        };
        const digits = "०१२३४५६७८९";
        const grid = document.getElementById("grid-container");
        const toggle = document.getElementById("collection-language");
        let language = "sa";

        function renderCollection() {
            const labels = copy[language];
            document.documentElement.lang = language;
            document.title = labels.title;
            document.getElementById("title").textContent = labels.title;
            document.getElementById("intro").textContent = labels.intro;
            document.getElementById("collection-credit").textContent = labels.credit;
            toggle.textContent = labels.switchTo;
            grid.setAttribute("aria-label", labels.chapters);

            const links = document.createDocumentFragment();
            for (let i = 1; i <= 18; i++) {
                const link = document.createElement("a");
                const number = language === "sa" ? String(i).replace(/\d/g, digit => digits[digit]) : i;
                link.href = `bg${i}.html`;
                link.textContent = `${labels.chapter} ${number}`;
                links.append(link);
            }
            grid.replaceChildren(links);
        }

        toggle.addEventListener("click", () => {
            language = language === "sa" ? "en" : "sa";
            renderCollection();
        });
        renderCollection();
    </script>
    <script type="module" src="../js/navbar-loader.js"></script>
</body>
</html>
