<!DOCTYPE html>
<html lang="sa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhatupatha Verb Swiper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="game-container">
        <div class="score-display">
            Score: <span id="score-counter">0</span> | 
            Streak: <span id="streak-counter" style="color: #6366f1;">0</span> | 
            High: <span id="high-counter" style="color: #eab308;">0</span> |
            Time: <span id="timer-display" style="color: #ef4444;">10</span>s
        </div>

        <div class="instructions-row">
            <span class="left-label">← Present (Lat)</span>
            <span class="right-label">Past (Lan) →</span>
        </div>
        
        <div class="swiper-zone">
            <div id="swipe-card" class="swipe-card">Loading...</div>
        </div>

        <div class="keyboard-guide">
            Tip: Use your Left (←) and Right (→) Arrow Keys to swipe!
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
